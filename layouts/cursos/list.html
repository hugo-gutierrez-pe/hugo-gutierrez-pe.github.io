<!DOCTYPE html>
<html lang="es-PE" data-theme="white">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }} — Hugo Gutierrez</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Tabler Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  
  <style>
    /* Theme variables - matching landing page */
    [data-theme="white"] {
      --bg-primary: #FFFFFF;
      --bg-secondary: #F7F7F5;
      --bg-tertiary: #F1EFE8;
      --text-primary: #1A1A1A;
      --text-secondary: #666666;
      --text-tertiary: #999999;
      --border-color: rgba(0,0,0,0.08);
      --border-secondary: rgba(0,0,0,0.12);
      --accent-blue: #185FA5;
      --accent-green: #3B6D11;
      --accent-amber: #BA7517;
      --badge-blue-bg: #E6F1FB;
      --badge-blue-text: #185FA5;
      --badge-gray-bg: #F1EFE8;
      --badge-gray-text: #5F5E5A;
      --badge-green-bg: #EAF3DE;
      --badge-green-text: #3B6D11;
      --exam-bg: #FAEEDA;
      --exam-border: #BA7517;
      --exam-text: #1A1A1A;
    }
    
    [data-theme="beige"] {
      --bg-primary: #FAF8F3;
      --bg-secondary: #F1EFE8;
      --bg-tertiary: #E8E5DC;
      --text-primary: #1A1A1A;
      --text-secondary: #666666;
      --text-tertiary: #999999;
      --border-color: rgba(0,0,0,0.06);
      --border-secondary: rgba(0,0,0,0.10);
      --accent-blue: #185FA5;
      --accent-green: #3B6D11;
      --accent-amber: #BA7517;
      --badge-blue-bg: #DDE9F5;
      --badge-blue-text: #185FA5;
      --badge-gray-bg: #E8E5DC;
      --badge-gray-text: #5F5E5A;
      --badge-green-bg: #E2EDD6;
      --badge-green-text: #3B6D11;
      --exam-bg: #F5EBDB;
      --exam-border: #BA7517;
      --exam-text: #1A1A1A;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      line-height: 1.7;
      color: var(--text-primary);
      background: var(--bg-primary);
      transition: background-color 0.3s ease;
    }
    
    /* Navigation */
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      border-bottom: 0.5px solid var(--border-color);
      background: var(--bg-primary);
    }
    
    .logo {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-primary);
      text-decoration: none;
    }
    
    .nav-right {
      display: flex;
      gap: 24px;
      align-items: center;
    }
    
    .nav-links {
      display: flex;
      gap: 24px;
    }
    
    .nav-links a {
      font-size: 14px;
      color: var(--text-secondary);
      text-decoration: none;
      transition: color 0.15s;
    }
    
    .nav-links a:hover {
      color: var(--text-primary);
    }
    
    #theme-toggle {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 20px;
      color: var(--text-secondary);
      transition: color 0.15s;
      padding: 4px;
    }
    
    #theme-toggle:hover {
      color: var(--text-primary);
    }
    
    /* Course Hero */
    .course-hero {
      max-width: 820px;
      margin: 0 auto;
      padding: 56px 24px 48px;
      border-bottom: 0.5px solid var(--border-color);
    }
    
    .course-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    
    .badge-primary {
      background: var(--badge-blue-bg);
      color: var(--badge-blue-text);
    }
    
    .badge-secondary {
      background: var(--badge-gray-bg);
      color: var(--badge-gray-text);
    }
    
    .badge-success {
      background: var(--badge-green-bg);
      color: var(--badge-green-text);
    }
    
    .course-hero-title {
      font-size: 38px;
      font-weight: 600;
      line-height: 1.2;
      margin-bottom: 16px;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }
    
    .course-hero-summary {
      font-size: 17px;
      line-height: 1.65;
      color: var(--text-secondary);
      margin-bottom: 32px;
      max-width: 640px;
    }
    
    .course-stats {
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
    }
    
    .stat-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--text-secondary);
    }
    
    .stat-item i {
      font-size: 18px;
      color: var(--text-tertiary);
    }
    
    /* Content */
    .course-content {
      max-width: 820px;
      margin: 0 auto;
      padding: 48px 24px 64px;
    }
    
    .course-content h2 {
      font-size: 26px;
      font-weight: 600;
      margin: 56px 0 24px;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }
    
    .course-content h2:first-child {
      margin-top: 0;
    }
    
    .course-content h3 {
      font-size: 19px;
      font-weight: 600;
      margin: 40px 0 20px;
      color: var(--text-primary);
      padding: 14px 18px;
      background: var(--bg-secondary);
      border-radius: 8px;
      border-left: 3px solid var(--accent-blue);
    }
    
    .course-content p {
      margin: 16px 0;
      color: var(--text-primary);
      line-height: 1.7;
    }
    
    .course-content ul {
      list-style: none;
      padding: 0;
      margin: 20px 0;
    }
    
    .course-content ul li {
      padding: 10px 0 10px 32px;
      position: relative;
      line-height: 1.7;
      color: var(--text-primary);
    }
    
    .course-content ul li::before {
      content: "✓";
      position: absolute;
      left: 0;
      color: var(--accent-green);
      font-weight: 600;
      font-size: 16px;
    }
    
    /* Tables */
    .course-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 28px 0;
      font-size: 14px;
      background: var(--bg-primary);
      border: 0.5px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
    }
    
    .course-content table th {
      text-align: left;
      padding: 14px 16px;
      background: var(--bg-secondary);
      font-weight: 600;
      color: var(--text-primary);
      border-bottom: 0.5px solid var(--border-color);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    
    .course-content table td {
      padding: 14px 16px;
      border-bottom: 0.5px solid var(--border-color);
      color: var(--text-primary);
      vertical-align: top;
    }
    
    .course-content table tr:last-child td {
      border-bottom: none;
    }
    
    .course-content table td:first-child {
      font-weight: 600;
      color: var(--accent-blue);
      white-space: nowrap;
    }
    
    .course-content table code {
      background: var(--bg-tertiary);
      padding: 3px 7px;
      border-radius: 4px;
      font-size: 12px;
      color: var(--text-secondary);
      font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
      font-weight: 500;
    }
    
    /* Blockquotes (exam markers) */
    .course-content blockquote {
      margin: 32px 0;
      padding: 18px 22px;
      background: var(--exam-bg);
      border-left: 3px solid var(--exam-border);
      border-radius: 8px;
    }
    
    .course-content blockquote p {
      margin: 0;
      font-size: 14px;
      color: var(--exam-text);
      font-weight: 500;
    }
    
    .course-content blockquote strong {
      color: var(--exam-border);
      font-weight: 600;
    }
    
    /* Links */
    .course-content a {
      color: var(--accent-blue);
      text-decoration: none;
      font-weight: 500;
      transition: opacity 0.15s;
    }
    
    .course-content a:hover {
      opacity: 0.7;
      text-decoration: underline;
    }
    
    /* Footer */
    .footer {
      padding: 32px 24px;
      text-align: center;
      background: var(--bg-secondary);
      border-top: 0.5px solid var(--border-color);
    }
    
    .footer-copy {
      font-size: 13px;
      color: var(--text-tertiary);
    }
    
    /* Responsive */
    @media (max-width: 640px) {
      .course-hero-title {
        font-size: 28px;
      }
      
      .course-stats {
        flex-direction: column;
        gap: 16px;
      }
      
      .nav-links {
        display: none;
      }
    }
  </style>
  
  <!-- Anti-FOUC theme script -->
  <script>
    (function() {
      const theme = localStorage.getItem('theme') || 'white';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>

<nav class="nav">
  <a href="/" class="logo">Hugo Gutierrez</a>
  <div class="nav-right">
    <div class="nav-links">
      <a href="/#cursos">Cursos</a>
      <a href="/#proyectos">Proyectos</a>
      <a href="/#contacto">Contacto</a>
    </div>
    <button id="theme-toggle" aria-label="Cambiar tema">
      <i class="ti ti-palette"></i>
    </button>
  </div>
</nav>

<article class="course-page">
  
  <header class="course-hero">
    <div class="course-badges">
      <span class="badge badge-primary">Bloomberg Terminal</span>
      <span class="badge badge-secondary">{{ .Params.codigo }} · {{ .Params.ciclo }}</span>
      <span class="badge badge-success">Acceso libre</span>
    </div>
    <h1 class="course-hero-title">{{ .Title }}</h1>
    <p class="course-hero-summary">{{ .Summary }}</p>
    <div class="course-stats">
      <div class="stat-item">
        <i class="ti ti-stack"></i>
        <span>13 sesiones</span>
      </div>
      <div class="stat-item">
        <i class="ti ti-clock"></i>
        <span>2 h por sesión</span>
      </div>
      <div class="stat-item">
        <i class="ti ti-chart-candle"></i>
        <span>Bloomberg · Excel · Capital IQ</span>
      </div>
      <div class="stat-item">
        <i class="ti ti-certificate"></i>
        <span>Prepara para el BMC</span>
      </div>
    </div>
  </header>

  <div class="course-content">
    {{ .Content }}
  </div>

</article>

<footer class="footer">
  <p class="footer-copy">© 2026 Hugo Gutierrez · Lima, Perú</p>
</footer>

<script>
  // Theme toggle
  const toggle = document.getElementById('theme-toggle');
  const html = document.documentElement;
  
  toggle.addEventListener('click', () => {
    const current = html.getAttribute('data-theme');
    const next = current === 'white' ? 'beige' : 'white';
    html.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  });
</script>

</body>
</html>
