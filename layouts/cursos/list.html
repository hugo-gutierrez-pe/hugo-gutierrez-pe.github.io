{{ define "main" }}
<script>
  (function() {
    var html = document.documentElement;
    html.classList.remove('dark');
    html.setAttribute('data-wc-theme-default', 'light');
    new MutationObserver(function(mutations) {
      mutations.forEach(function(m) {
        if (m.attributeName === 'class' && html.classList.contains('dark')) {
          html.classList.remove('dark');
        }
      });
    }).observe(html, { attributes: true, attributeFilter: ['class'] });
  })();
</script>
<article class="course-page">
  
  <!-- Hero del curso -->
  <header class="course-hero">
    <div class="course-badges">
      <span class="badge badge-primary">Bloomberg Terminal</span>
      <span class="badge badge-secondary">{{ .Params.codigo }} · {{ .Params.ciclo }}</span>
      <span class="badge badge-success">Acceso libre</span>
    </div>
    <h1 class="course-hero-title">{{ .Title }}</h1>
    <p class="course-hero-summary">{{ .Summary }}</p>
    <div class="course-stats">
      <div class="stat-item">
        <i class="ti ti-stack"></i>
        <span>13 sesiones</span>
      </div>
      <div class="stat-item">
        <i class="ti ti-clock"></i>
        <span>2 h por sesión</span>
      </div>
      <div class="stat-item">
        <i class="ti ti-chart-candle"></i>
        <span>Bloomberg · Excel · Capital IQ</span>
      </div>
      <div class="stat-item">
        <i class="ti ti-certificate"></i>
        <span>Prepara para el BMC</span>
      </div>
    </div>
  </header>

  <!-- Contenido principal -->
  <div class="course-content">
    {{ .Content }}
  </div>

</article>

<style>
/* Force light mode: override HugoBlox dark-mode CSS variables */
:root, html.dark {
  --hb-color-background: #ffffff !important;
  --hb-color-foreground: #111827 !important;
  --hb-color-header-bg: #f1f5f9 !important;
  --hb-color-header-fg: #0f172a !important;
  --hb-color-footer-bg: #f3f4f6 !important;
  --hb-color-footer-fg: #0f172a !important;
}

.course-page {
  max-width: 820px;
  margin: 0 auto;
  padding: 0;
}

.course-hero {
  padding: 48px 24px 40px;
  border-bottom: 0.5px solid rgba(0,0,0,0.08);
}

.course-badges {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.badge {
  font-size: 11px;
  font-weight: 500;
  padding: 4px 12px;
  border-radius: 6px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.badge-primary {
  background: #E6F1FB;
  color: #185FA5;
}

.badge-secondary {
  background: #F1EFE8;
  color: #5F5E5A;
}

.badge-success {
  background: #EAF3DE;
  color: #3B6D11;
}

.course-hero-title {
  font-size: 32px;
  font-weight: 500;
  line-height: 1.2;
  margin-bottom: 12px;
  color: #1A1A1A;
}

.course-hero-summary {
  font-size: 16px;
  line-height: 1.6;
  color: #666666;
  margin-bottom: 28px;
  max-width: 600px;
}

.course-stats {
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
}

.stat-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  color: #666666;
}

.stat-item i {
  font-size: 18px;
  color: #999999;
}

.course-content {
  padding: 40px 24px;
}

.course-content h2 {
  font-size: 24px;
  font-weight: 500;
  margin: 48px 0 20px;
  color: #1A1A1A;
}

.course-content h3 {
  font-size: 18px;
  font-weight: 500;
  margin: 32px 0 16px;
  color: #1A1A1A;
  background: #F7F7F5;
  padding: 12px 16px;
  border-radius: 8px;
  border-left: 3px solid #185FA5;
}

.course-content ul {
  list-style: none;
  padding: 0;
  margin: 16px 0;
}

.course-content ul li {
  padding: 8px 0 8px 28px;
  position: relative;
  line-height: 1.6;
  color: #1A1A1A;
}

.course-content ul li::before {
  content: "✓";
  position: absolute;
  left: 0;
  color: #3B6D11;
  font-weight: 500;
}

.course-content table {
  width: 100%;
  border-collapse: collapse;
  margin: 24px 0;
  font-size: 14px;
}

.course-content table th {
  text-align: left;
  padding: 12px;
  background: #F7F7F5;
  font-weight: 500;
  color: #1A1A1A;
  border-bottom: 0.5px solid rgba(0,0,0,0.08);
}

.course-content table td {
  padding: 12px;
  border-bottom: 0.5px solid rgba(0,0,0,0.08);
  color: #1A1A1A;
}

.course-content table td:first-child {
  font-weight: 500;
  color: #185FA5;
}

.course-content table code {
  background: #F7F7F5;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 12px;
  color: #666666;
  font-family: 'Monaco', 'Menlo', monospace;
}

.course-content blockquote {
  margin: 24px 0 !important;
  padding: 16px 20px !important;
  background: #FAEEDA !important;
  border-left: 3px solid #BA7517 !important;
  border-right: none !important;
  border-top: none !important;
  border-bottom: none !important;
  border-radius: 8px !important;
  font-style: normal !important;
}

.course-content blockquote p {
  margin: 0;
  font-size: 14px;
  color: #1A1A1A;
}

.course-content blockquote strong {
  color: #BA7517;
}

.course-content a {
  color: #185FA5;
  text-decoration: none;
}

.course-content a:hover {
  text-decoration: underline;
}

@media (max-width: 640px) {
  .course-hero-title {
    font-size: 24px;
  }
  .course-stats {
    flex-direction: column;
    gap: 12px;
  }
}
</style>
{{ end }}
